name: nebula_crm
description: "Nebula CRM — An advanced AI-powered CRM built with Flutter, Firebase, and Riverpod. Dark premium UI for mobile-first sales teams."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  cloud_functions: ^5.1.4

  # ── State management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Routing ─────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Auth helpers ────────────────────────────────────────────
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  local_auth: ^2.3.0

  # ── UI / Charts ─────────────────────────────────────────────
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.2.0+3

  # ── Forms / Inputs ──────────────────────────────────────────
  # (using built-in TextFormField with custom validators for now)

  # ── Persistence / Offline ───────────────────────────────────
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5

  # ── Utilities ───────────────────────────────────────────────
  intl: ^0.20.0
  uuid: ^4.5.1
  collection: ^1.18.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  device_info_plus: ^11.1.0
  package_info_plus: ^8.0.2

  # ── AI / Networking ─────────────────────────────────────────
  http: ^1.2.2
  dio: ^5.7.0

  # ── Kanban / Drag-drop ──────────────────────────────────────
  reorderables: ^0.6.0

  # ── Rich text editor (notes / knowledge base) ───────────────
  # (deferred — pull in flutter_quill ^11.5+ when ready to use)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
