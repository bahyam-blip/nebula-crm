name = "nebula-crm-storage"
main = "src/index.js"
compatibility_date = "2025-06-01"
account_id = "af3007244dc00e001004045fd488b42b"

# Direct bucket binding. This is why no S3 access keys exist anywhere in
# the project: the Worker is granted the bucket, not a credential pair.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nebula-crm1"

# ── CRM database (D1) ─────────────────────────────────────────────────
# The whole CRM database lives here since the Firestore migration. The
# CI workflow fills D1_DATABASE_ID with the real database UUID at deploy
# time (create-if-missing, then `wrangler d1 info`), so this file never
# carries an account-specific id.
[[d1_databases]]
binding = "DB"
database_name = "nebula-crm-db"
database_id = "D1_DATABASE_ID"

# ── AI mailer cron ────────────────────────────────────────────────────
# Every 5 min the worker plans new owner tasks, prepares due emails and
# kicks their CHUNKED delivery chains (each chain step is its own worker
# invocation with a fresh subrequest budget — see emailer/pipeline.js):
#   small audiences  → MailerCloud Email API, private 1:1, ≤25 sends/step;
#   large audiences  → scheduled MailerCloud campaign on a dedicated list.
# The mailer no-ops cheaply until configured — see SETUP_INSTRUCTIONS.
[triggers]
crons = ["*/5 * * * *"]

# ── AI mailer state (tasks, dedup lock, analytics cache) ──────────────
# OPTIONAL. The mailer stores its state in Firestore by default (it already
# holds the Firebase service account) — no KV setup is required anymore.
# If you prefer Workers KV, create a namespace and uncomment the block:
#   npx wrangler kv namespace create NEBULA_EMAIL_KV
# [[kv_namespaces]]
# binding = "NEBULA_EMAIL_KV"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

# ── Self service binding (chunked delivery) ───────────────────────────
# A Worker on workers.dev cannot HTTP-fetch ITSELF (Cloudflare error 1042),
# so the delivery chain calls itself through this binding instead. Each
# bound invocation runs with its OWN subrequest budget — that is what lets
# a 200/1000/9000-recipient 1:1 campaign complete in short, fresh-budget
# steps (see emailer/pipeline.js).
[[services]]
binding = "SELF"
service = "nebula-crm-storage"

[vars]
FIREBASE_PROJECT_ID = "nebula-crm-70f58"
DEFAULT_TEAM_ID = "default-team"

# ── AI mailer settings (non-secret — edit freely) ─────────────────────
# The mailer needs this SECRET to send (pushed automatically by the deploy
# workflow from GitHub secrets — check that workflow's summary for readiness):
#   MAILERCLOUD_API_KEY
# Optional secrets: SARVAM_API_KEY (AI planning/copy — without it only the
# test send + status work), MAILERCLOUD_SENDER_EMAIL, FIREBASE_SERVICE_ACCOUNT.
# Sender identity: MAILERCLOUD_SENDER_EMAIL (secret) → MAIL_SENDER_EMAIL
# (var below) → built-in default das@aidraft.bond (verified domain sender).
MAIL_BUSINESS_NAME = "Nebula CRM"
MAIL_BUSINESS_PROFILE = ""          # e.g. "Nebula CRM is an AI-powered CRM for Indian sales teams: contacts, telecalling, deals, campaigns."
MAIL_WEBSITE_URL = ""               # the AI reads this page to understand the business
MAIL_CTA_URL = ""                   # button link in every email (falls back to MAIL_WEBSITE_URL)
MAIL_BRAND_COLOR = "#6C8CFF"        # electric indigo — matches the app theme
MAIL_LOGO_URL = ""
MAIL_TIMEZONE = "Asia/Calcutta"
MAIL_TEAM_ID = ""                   # optional: only sync contacts of this team (empty = all)
MAIL_DRY_RUN = "false"              # live mode. The owner can flip this any time from the app (AI Email screen) or POST /v1/mail/config {"dry_run":true}.
MAIL_CRON_ENABLED = "true"          # emergency brake: set to "false" (and redeploy) to stop ALL autonomous runs if you ever need to protect the database.
MAIL_SELF_URL = "https://nebula-crm-storage.nebula-crm.workers.dev"  # the delivery chain calls ITSELF here for a fresh subrequest budget each batch
MAIL_LOOKAHEAD_MINUTES = "10"       # deliver emails due within this window; the 5-min cron keeps sends within ~±5 min of the AI-chosen time
MAIL_SEND_CHUNK = "25"              # private 1:1 emails per chain invocation (Workers free plan = 50 subrequests/invocation)
MAIL_SYNC_ROWS = "1000"             # contacts uploaded to the dedicated campaign list per chain invocation (campaign mode, 1000s+)
MAIL_MAX_SYNC = "20000"             # cap on contacts pulled from D1 per run (hundreds/thousands are fine)
MAIL_ANALYTICS_INTERVAL_HOURS = "20"
MC_CREATE_TEMPLATES = "true"        # save every AI template into MailerCloud's template library

# ── Sending identity & delivery engine ────────────────────────────────
MAIL_SENDER_EMAIL = "das@aidraft.bond"  # verified domain sender (secret MAILERCLOUD_SENDER_EMAIL overrides this)
MAIL_FROM_NAME = "Nebula CRM"           # inbox display name
MAIL_DELIVERY_MODE = "auto"             # auto | transactional | campaign
MAIL_TRANSACTIONAL_MAX = "1000"         # in auto mode: audiences up to this size go via the Email API (immediate, personalized 1:1, chunked + resumable), larger ones via scheduled campaign on a DEDICATED per-campaign list
MAIL_FREQ_HOURS = "20"                  # frequency cap: a contact emailed within this window is skipped (unless explicitly named)

[observability]
enabled = true
