name = "nebula-crm-storage"
main = "src/index.js"
compatibility_date = "2025-06-01"
account_id = "af3007244dc00e001004045fd488b42b"

# Direct bucket binding. This is why no S3 access keys exist anywhere in
# the project: the Worker is granted the bucket, not a credential pair.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nebula-crm1"

# ── AI mailer cron ────────────────────────────────────────────────────
# Every 30 min the worker plans new owner tasks and creates scheduled
# MailerCloud campaigns (delivery happens at the AI-chosen minute). The
# mailer no-ops cheaply until configured — see SETUP_INSTRUCTIONS.
[triggers]
crons = ["*/30 * * * *"]

# ── AI mailer state (tasks, dedup lock, analytics cache) ──────────────
# OPTIONAL. The mailer stores its state in Firestore by default (it already
# holds the Firebase service account) — no KV setup is required anymore.
# If you prefer Workers KV, create a namespace and uncomment the block:
#   npx wrangler kv namespace create NEBULA_EMAIL_KV
# [[kv_namespaces]]
# binding = "NEBULA_EMAIL_KV"
# id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
FIREBASE_PROJECT_ID = "nebula-crm-70f58"

# ── AI mailer settings (non-secret — edit freely) ─────────────────────
# The mailer needs these SECRETS to send (pushed automatically by the
# deploy workflow from GitHub secrets — check that workflow's summary for
# readiness):
#   SARVAM_API_KEY, MAILERCLOUD_API_KEY, MAILERCLOUD_SENDER_EMAIL,
#   FIREBASE_SERVICE_ACCOUNT
# The AI also learns your business from MAIL_BUSINESS_PROFILE / website
# below; when both are empty it infers it from your CRM data + your task
# instructions (see /v1/mail/status → business_understood).
MAIL_BUSINESS_NAME = "Nebula CRM"
MAIL_BUSINESS_PROFILE = ""          # e.g. "Nebula CRM is an AI-powered CRM for Indian sales teams: contacts, telecalling, deals, campaigns."
MAIL_WEBSITE_URL = ""               # the AI reads this page to understand the business
MAIL_CTA_URL = ""                   # button link in every email (falls back to MAIL_WEBSITE_URL)
MAIL_BRAND_COLOR = "#6C8CFF"        # electric indigo — matches the app theme
MAIL_LOGO_URL = ""
MAIL_TIMEZONE = "Asia/Calcutta"
MAIL_TEAM_ID = ""                   # optional: only sync contacts of this team (empty = all)
MAIL_MAX_SYNC = "5000"              # cap on contacts pulled from Firestore per run
MAIL_DRY_RUN = "false"              # live mode. The owner can flip this any time from the app (AI Email screen) or POST /v1/mail/config {"dry_run":true}.
MAIL_LOOKAHEAD_HOURS = "26"         # create scheduled campaigns up to this many hours ahead
MAIL_ANALYTICS_INTERVAL_HOURS = "20"
MC_CREATE_TEMPLATES = "true"        # save every AI template into MailerCloud's template library

[observability]
enabled = true
