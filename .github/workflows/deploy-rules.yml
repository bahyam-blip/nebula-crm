name: Deploy Firebase Rules

on:
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-rules.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Firestore + Storage Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/service-account.json"
          if ! python3 -c "import json;json.load(open('$HOME/service-account.json'))"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Re-paste the whole key file."
            exit 1
          fi
          EMAIL=$(python3 -c "import json;print(json.load(open('$HOME/service-account.json')).get('client_email','?'))")
          PROJ=$(python3 -c "import json;print(json.load(open('$HOME/service-account.json')).get('project_id','?'))")
          echo "Service account: $EMAIL (project: $PROJ)"
          echo "FIREBASE_SERVICE_ACCOUNT_PATH=$HOME/service-account.json" >> "$GITHUB_ENV"

      # Turn on the Google APIs this project needs. Doing it here rather than
      # by hand in the console means it is reproducible and self-documenting.
      - name: Enable required Google APIs
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.FIREBASE_SERVICE_ACCOUNT_PATH }}
        run: |
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import google.auth, google.auth.transport.requests as gt, requests, time

          PROJECT = "nebula-crm-70f58"
          # Storage deliberately omitted: media lives in Cloudflare R2.
          SERVICES = [
              "firestore.googleapis.com",      # Cloud Firestore
              "firebaserules.googleapis.com",  # rules + indexes deploys
              "identitytoolkit.googleapis.com" # Firebase Auth
          ]

          creds, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(gt.Request())
          h = {"Authorization": f"Bearer {creds.token}"}

          for svc in SERVICES:
              base = (f"https://serviceusage.googleapis.com/v1/"
                      f"projects/{PROJECT}/services/{svc}")
              state = requests.get(base, headers=h, timeout=30)
              if state.status_code == 200 and state.json().get("state") == "ENABLED":
                  print(f"::warning::API {svc} already ENABLED")
                  continue
              r = requests.post(base + ":enable", headers=h, json={}, timeout=60)
              if r.status_code in (200, 201):
                  print(f"::warning::API {svc} enable requested OK")
              else:
                  msg = r.text.replace("\n", " ")[:200]
                  print(f"::error::API {svc} enable FAILED {r.status_code} {msg}")

          # Enabling is asynchronous; give it a moment before the deploy runs.
          time.sleep(20)
          for svc in SERVICES:
              r = requests.get(
                  f"https://serviceusage.googleapis.com/v1/"
                  f"projects/{PROJECT}/services/{svc}", headers=h, timeout=30)
              st = r.json().get("state") if r.status_code == 200 else r.status_code
              print(f"::warning::API {svc} state={st}")
          PY

      # Definitive diagnosis: call the Firestore + Storage admin APIs directly,
      # bypassing the CLI's serviceusage precheck. Results come back as
      # annotations so they're readable without downloading logs.
      - name: Diagnose project state
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.FIREBASE_SERVICE_ACCOUNT_PATH }}
        run: |
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, google.auth, google.auth.transport.requests as gt, requests
          sa = json.load(open("/home/runner/service-account.json"))
          email = sa.get("client_email"); proj = sa.get("project_id")
          print(f"::warning::SA_EMAIL {email}")
          print(f"::warning::SA_PROJECT {proj}")
          creds, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(gt.Request())
          h = {"Authorization": f"Bearer {creds.token}"}
          for label, url in [
              ("FIRESTORE_DB",
               "https://firestore.googleapis.com/v1/projects/nebula-crm-70f58/databases"),
              ("STORAGE_BUCKETS",
               "https://firebasestorage.googleapis.com/v1beta/projects/nebula-crm-70f58/buckets"),
          ]:
              try:
                  r = requests.get(url, headers=h, timeout=30)
                  body = r.text.replace("\n", " ")[:300]
                  print(f"::warning::{label} HTTP {r.status_code} {body}")
              except Exception as e:
                  print(f"::warning::{label} EXCEPTION {e}")
          PY

      # Deployed separately so a missing bucket doesn't mask the Firestore result.
      # Deploy over REST rather than `firebase deploy`. The CLI runs a
      # Service Usage precheck that needs serviceusage.services.get, which
      # this service account lacks, so it 403s even though the Firestore and
      # Rules APIs are enabled and working.
      - name: Deploy Firestore rules and indexes
        id: firestore
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.FIREBASE_SERVICE_ACCOUNT_PATH }}
        run: |
          pip install --quiet google-auth requests
          python3 scripts/deploy_firestore.py

      # Kept for reference only. Media is stored in Cloudflare R2, so this is
      # expected to be skipped and never gates the workflow.
      - name: Deploy Storage rules (optional)
        id: storage
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.FIREBASE_SERVICE_ACCOUNT_PATH }}
        run: |
          set -o pipefail
          if firebase deploy --only storage --project nebula-crm-70f58 \
               --non-interactive 2>&1 | tee /tmp/st.log; then
            echo "Storage rules deployed."
          else
            grep -iE "error|denied|not found|has not been used|PERMISSION|does not exist|bucket" /tmp/st.log \
              | head -12 | while IFS= read -r l; do echo "::error::STORAGE ${l}"; done
            exit 1
          fi

      - name: Summarise
        run: |
          echo "Firestore: ${{ steps.firestore.outcome }}"
          echo "Storage:   ${{ steps.storage.outcome }} (optional - media is in R2)"
          if [ "${{ steps.firestore.outcome }}" != "success" ]; then
            echo "::error::A rule deployment failed — see the annotations above."
            echo "::error::If the error is HTTP 403 from serviceusage.googleapis.com, the"
            echo "::error::service account is missing IAM roles. Grant it, on project nebula-crm-70f58:"
            echo "::error::  - roles/serviceusage.serviceUsageConsumer  (Service Usage Consumer)"
            echo "::error::  - roles/firebaserules.admin                (Firebase Rules Admin)"
            echo "::error::IAM console: https://console.cloud.google.com/iam-admin/iam?project=nebula-crm-70f58"
            echo "::error::If instead it says the database or bucket does not exist, create it once:"
            echo "::error::Firestore: https://console.firebase.google.com/project/nebula-crm-70f58/firestore"
            echo "::error::Storage:   https://console.firebase.google.com/project/nebula-crm-70f58/storage"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/service-account.json"
