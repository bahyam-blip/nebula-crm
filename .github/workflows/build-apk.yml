name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Required for softprops/action-gh-release to create releases
permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Firebase Android config ────────────────────────────────────
      # Google Sign-In fails with ApiException: 10 (DEVELOPER_ERROR) unless the
      # signing certificate's SHA-1 is registered against the Firebase Android
      # app AND google-services.json contains the resulting oauth_client entry.
      #
      # We register the committed debug keystore's SHA-1 and then pull a FRESH
      # google-services.json straight from Firebase, so the config can never
      # drift out of sync with the project.
      - name: Register signing SHA-1 and fetch google-services.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_PROJECT: nebula-crm-70f58
          FIREBASE_ANDROID_APP_ID: "1:972178938095:android:8096a3ac04c2b96ecfa31a"
        run: |
          set -e

          # SHA-1 of android/app/debug.keystore (committed, stable).
          SHA1=$(keytool -list -v \
                   -keystore android/app/debug.keystore \
                   -storepass android -alias androiddebugkey 2>/dev/null \
                 | grep 'SHA1:' | awk '{print $2}')
          echo "Debug keystore SHA-1: $SHA1"
          if [ -z "$SHA1" ]; then
            echo "::error::Could not read SHA-1 from android/app/debug.keystore"
            exit 1
          fi

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
            npm install -g firebase-tools@latest --silent

            # Idempotent: re-registering an existing SHA is a no-op error.
            echo "Registering SHA-1 with Firebase app $FIREBASE_ANDROID_APP_ID ..."
            firebase apps:android:sha:create \
              "$FIREBASE_ANDROID_APP_ID" "$SHA1" \
              --project "$FIREBASE_PROJECT" 2>&1 | tee /tmp/sha.log || {
                if grep -qiE "already exists|ALREADY_EXISTS" /tmp/sha.log; then
                  echo "SHA-1 already registered — continuing."
                else
                  echo "::warning::Could not register SHA-1 automatically."
                  sed 's/^/::warning::SHA /' /tmp/sha.log | head -8
                fi
              }

            echo "Fetching fresh google-services.json ..."
            if firebase apps:sdkconfig ANDROID "$FIREBASE_ANDROID_APP_ID" \
                 --project "$FIREBASE_PROJECT" \
                 --out android/app/google-services.json 2>&1 | tee /tmp/cfg.log; then
              echo "Fetched google-services.json from Firebase."
            else
              echo "::warning::sdkconfig fetch failed; falling back to the GOOGLE_SERVICES_JSON secret."
              sed 's/^/::warning::CFG /' /tmp/cfg.log | head -8
            fi
            rm -f "$HOME/sa.json"
          fi

          # Fallback to the stored secret if we still have no config.
          if [ ! -s android/app/google-services.json ]; then
            if [ -z "$GOOGLE_SERVICES_JSON" ]; then
              echo "::error::No google-services.json available (no service account and no GOOGLE_SERVICES_JSON secret)."
              exit 1
            fi
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Restored google-services.json from secret."
          fi

          # ── Validate: this is what actually determines Sign-In success ──
          python3 - <<'PY'
          import json, sys, os
          p = 'android/app/google-services.json'
          cfg = json.load(open(p))
          pkg = 'com.nebula.nebula_crm'
          clients = cfg.get('client', [])
          me = [c for c in clients
                if c.get('client_info', {}).get('android_client_info', {})
                     .get('package_name') == pkg]
          if not me:
              print(f"::error::google-services.json has no client for package {pkg}.")
              sys.exit(1)
          oauth = me[0].get('oauth_client', [])
          types = sorted({str(o.get('client_type')) for o in oauth})
          print(f"oauth_client entries: {len(oauth)} (types: {types or 'none'})")
          # type 1 = Android client (needs SHA-1); type 3 = web client (gives idToken)
          has_android = any(o.get('client_type') == 1 for o in oauth)
          has_web     = any(o.get('client_type') == 3 for o in oauth)
          if not has_android:
              print("::error::No Android OAuth client (client_type 1) in google-services.json.")
              print("::error::This is the exact cause of ApiException: 10 (DEVELOPER_ERROR).")
              print("::error::The SHA-1 is not registered on the Firebase Android app.")
          if not has_web:
              print("::error::No web OAuth client (client_type 3). Firebase needs it to mint an idToken.")
              print("::error::Enable Google as a sign-in provider: Firebase console > Authentication > Sign-in method > Google.")
          if not (has_android and has_web):
              sys.exit(1)
          print("google-services.json looks correct for Google Sign-In.")
          PY

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis (informational)
        run: |
          flutter analyze 2>&1 | tee /tmp/analyze.log || true
          # Surface real analyzer errors as annotations so they're visible
          # in the run summary and via the API without downloading logs.
          grep -iE "^[[:space:]]*error[[:space:]]" /tmp/analyze.log | head -40 \
            | while IFS= read -r line; do echo "::error::ANALYZE ${line}"; done || true

      - name: Configure Flutter for non-interactive build
        run: flutter config --no-analytics

      - name: Build debug APK
        run: |
          set -o pipefail
          if flutter build apk --release --split-per-abi --no-tree-shake-icons 2>&1 | tee /tmp/build.log \
             && flutter build apk --release --no-tree-shake-icons 2>&1 | tee -a /tmp/build.log \
             && flutter build apk --debug --no-tree-shake-icons 2>&1 | tee -a /tmp/build.log; then
            echo "Build succeeded."
          else
            echo "::group::Root-cause lines"
            # Dart compile errors, Gradle failures and missing-asset errors.
            grep -nE "\.dart:[0-9]+:[0-9]+:|^[[:space:]]*Error:|FAILURE:|What went wrong|Execution failed|no such file|not found in|Cannot resolve|Missing class|R8:|> Task .* FAILED|Caused by:|error:" \
              /tmp/build.log | head -60 | tee /tmp/root.log
            echo "::endgroup::"
            while IFS= read -r line; do
              echo "::error::BUILD ${line}"
            done < /tmp/root.log
            exit 1
          fi

      - name: List built APK
        run: |
          ls -lh build/app/outputs/flutter-apk/ || true
          find build -name "*.apk" -exec ls -lh {} \;

      - name: Diagnose install blockers
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -r | head -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          DIR=build/app/outputs/flutter-apk

          for APK in "$DIR/app-arm64-v8a-release.apk" "$DIR/app-release.apk" "$DIR/app-debug.apk"; do
            [ -e "$APK" ] || continue
            B=$(basename "$APK")
            echo "::group::$B"
            "$AAPT" dump badging "$APK" | head -50
            echo "::endgroup::"

            # Anything here that is required=true and absent on the handset
            # makes the installer refuse with a generic "can't install".
            "$AAPT" dump badging "$APK" \
              | grep -E "^(sdkVersion|targetSdkVersion|native-code|uses-feature|compatible-screens|supports-screens|uses-library)" \
              | head -20 | while IFS= read -r l; do echo "::warning::[$B] $l"; done

            # Manifest flags that block sideloading outright.
            "$AAPT" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/m.txt 2>/dev/null || \
              "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/m.txt 2>/dev/null || true
            grep -inE "testOnly|isSplitRequired|requiredSplitTypes|splitTypes|extractNativeLibs|minSdkVersion|debuggable" /tmp/m.txt \
              | head -15 | while IFS= read -r l; do echo "::warning::[$B] MANIFEST $l"; done

            # Signing scheme + certificate identity.
            "$SIGNER" verify --print-certs "$APK" 2>&1 \
              | grep -iE "Signer #1 certificate SHA-256|Verified using v[1-4]|DOES NOT VERIFY|WARNING" \
              | head -8 | while IFS= read -r l; do echo "::warning::[$B] SIGN $l"; done

            # 16 KB page alignment: Android 15 refuses unaligned native libs.
            python3 - "$APK" <<'PYEOF'
          import sys, zipfile
          apk = sys.argv[1]
          name = apk.split('/')[-1]
          with zipfile.ZipFile(apk) as z:
              libs = [i for i in z.infolist() if i.filename.endswith('.so')]
              stored = [i for i in libs if i.compress_type == zipfile.ZIP_STORED]
              bad = [i for i in stored if i.header_offset % 16384 != 0]
              print(f"::warning::[{name}] native libs={len(libs)} uncompressed={len(stored)} "
                    f"not-16KB-aligned={len(bad)}")
              for i in bad[:3]:
                  print(f"::warning::[{name}] unaligned {i.filename} @ {i.header_offset}")
          PYEOF
          done

      - name: Collect APKs and report sizes
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/ 2>/dev/null || true
          # Drop the .sha1 companions Gradle emits.
          rm -f artifacts/*.sha1
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          for f in artifacts/*.apk; do
            SZ=$(du -h "$f" | cut -f1)
            echo "- $(basename "$f") — $SZ" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::APK $(basename "$f") $SZ"
          done
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-crm-apk
          path: artifacts/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
