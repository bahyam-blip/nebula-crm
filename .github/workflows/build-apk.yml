name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Required for softprops/action-gh-release to create releases
permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. APK will fail to build."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "google-services.json restored (size: $(wc -c < android/app/google-services.json) bytes)"

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Verify analysis (informational)
        run: |
          flutter analyze 2>&1 | tee /tmp/analyze.log || true
          # Surface real analyzer errors as annotations so they're visible
          # in the run summary and via the API without downloading logs.
          grep -iE "^[[:space:]]*error[[:space:]]" /tmp/analyze.log | head -40 \
            | while IFS= read -r line; do echo "::error::ANALYZE ${line}"; done || true

      - name: Configure Flutter for non-interactive build
        run: flutter config --no-analytics

      - name: Build debug APK
        run: |
          set -o pipefail
          if flutter build apk --debug --no-tree-shake-icons 2>&1 | tee /tmp/build.log; then
            echo "Build succeeded."
          else
            echo "::group::Root-cause lines"
            # Dart compile errors, Gradle failures and missing-asset errors.
            grep -nE "\.dart:[0-9]+:[0-9]+:|^[[:space:]]*Error:|FAILURE:|What went wrong|Execution failed|no such file|not found in|Cannot resolve" \
              /tmp/build.log | head -40 | tee /tmp/root.log
            echo "::endgroup::"
            while IFS= read -r line; do
              echo "::error::BUILD ${line}"
            done < /tmp/root.log
            exit 1
          fi

      - name: List built APK
        run: |
          ls -lh build/app/outputs/flutter-apk/ || true
          find build -name "*.apk" -exec ls -lh {} \;

      - name: Rename APK for clarity
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/nebula-crm-debug.apk
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-crm-debug-apk
          path: artifacts/nebula-crm-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/nebula-crm-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
