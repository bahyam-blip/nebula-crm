name: Deploy Storage Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'cloudflare/worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A workers.dev subdomain is a one-time, account-wide setting. Wrangler
      # can only prompt for it interactively, which fails in CI, so register
      # it over the API instead.
      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: af3007244dc00e001004045fd488b42b
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/subdomain"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          CUR=$(curl -s -H "$AUTH" "$API")
          NAME=$(echo "$CUR" | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')" 2>/dev/null || echo "")

          if [ -n "$NAME" ]; then
            echo "::warning::SUBDOMAIN already registered: $NAME"
            exit 0
          fi

          # Subdomains are globally unique, so try a few candidates.
          for CAND in nebula-crm nebula-crm-app nebula-crm-${ACCOUNT:0:8}; do
            RES=$(curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" \
                    --data "{\"subdomain\":\"$CAND\"}" "$API")
            OK=$(echo "$RES" | python3 -c "import sys,json;print(json.load(sys.stdin).get('success'))" 2>/dev/null || echo False)
            if [ "$OK" = "True" ]; then
              echo "::warning::SUBDOMAIN registered: $CAND"
              exit 0
            fi
            echo "::warning::SUBDOMAIN '$CAND' unavailable: $(echo "$RES" | head -c 200)"
          done
          echo "::error::Could not register a workers.dev subdomain automatically."
          echo "::error::Register one manually: https://dash.cloudflare.com/$ACCOUNT/workers/onboarding"
          exit 1

      - name: Push Sarvam key as a Worker secret
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
          SARVAM_AI_API: ${{ secrets.SARVAM_AI_API }}
        run: |
          if [ -z "$SARVAM_AI_API" ]; then
            echo "::warning::SARVAM_AI_API not set - AI endpoint will return 503."
            exit 0
          fi
          printf '%s' "$SARVAM_AI_API" \
            | npx --yes wrangler@latest secret put SARVAM_API_KEY 2>&1 | tail -3
          echo "::warning::SARVAM_API_KEY stored as a Worker secret"

      - name: Push MailerCloud key as a Worker secret (AI mailer)
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
          MAILERCLOUD_API_KEY: ${{ secrets.MAILERCLOUD_API_KEY }}
          MAILERCLOUD_SENDER_EMAIL: ${{ secrets.MAILERCLOUD_SENDER_EMAIL }}
        run: |
          # API key comes from app.mailercloud.com (Account → API Integrations).
          # The sender falls back to MAIL_SENDER_EMAIL in wrangler.toml
          # (das@aidraft.bond, the verified domain sender) when the secret is
          # absent — but an explicit secret always wins.
          if [ -z "$MAILERCLOUD_API_KEY" ]; then
            echo "::warning::MAILERCLOUD_API_KEY not set - AI mailer disabled (/v1/mail/status explains)."
            exit 0
          fi
          printf '%s' "$MAILERCLOUD_API_KEY" \
            | npx --yes wrangler@latest secret put MAILERCLOUD_API_KEY 2>&1 | tail -3
          if [ -n "$MAILERCLOUD_SENDER_EMAIL" ]; then
            printf '%s' "$MAILERCLOUD_SENDER_EMAIL" \
              | npx --yes wrangler@latest secret put MAILERCLOUD_SENDER_EMAIL 2>&1 | tail -3
            echo "::warning::MAILERCLOUD_SENDER_EMAIL stored as a Worker secret"
          else
            printf '%s' "das@aidraft.bond" \
              | npx --yes wrangler@latest secret put MAILERCLOUD_SENDER_EMAIL 2>&1 | tail -3
            echo "::warning::MAILERCLOUD_SENDER_EMAIL not in repo secrets - default verified sender das@aidraft.bond pushed instead"
          fi
          echo "::warning::MAILERCLOUD_API_KEY stored as a Worker secret"

      - name: Push Firebase service account as a Worker secret
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT not set - push disabled."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            | npx --yes wrangler@latest secret put FIREBASE_SERVICE_ACCOUNT 2>&1 | tail -3
          echo "::warning::FIREBASE_SERVICE_ACCOUNT stored as a Worker secret"

      # The AI mailer stays inert until MAILERCLOUD_API_KEY exists in THIS
      # repo's Actions secrets. Surface readiness where the owner will
      # actually see it: the run summary page.
      - name: AI mailer readiness summary
        if: always()
        env:
          MAILERCLOUD_API_KEY_SET: ${{ secrets.MAILERCLOUD_API_KEY != '' }}
          MAILERCLOUD_SENDER_EMAIL_SET: ${{ secrets.MAILERCLOUD_SENDER_EMAIL != '' }}
          SARVAM_AI_API_SET: ${{ secrets.SARVAM_AI_API != '' }}
        run: |
          {
            echo "## 📧 AI Email system — readiness"
            echo ""
            echo "| Requirement | Status |"
            echo "|---|---|"
            echo "| SARVAM_AI_API secret | $([ '$SARVAM_AI_API_SET' = 'true' ] && echo '✅ set' || echo '❌ missing (AI planning/copy disabled)') |"
            echo "| FIREBASE_SERVICE_ACCOUNT secret | ✅ set |"
            echo "| MAILERCLOUD_API_KEY secret | $([ '$MAILERCLOUD_API_KEY_SET' = 'true' ] && echo '✅ set' || echo '❌ **missing — email sending is disabled**') |"
            echo "| MAILERCLOUD_SENDER_EMAIL secret | $([ '$MAILERCLOUD_SENDER_EMAIL_SET' = 'true' ] && echo '✅ set' || echo '➖ not set — default verified sender **das@aidraft.bond** is used automatically') |"
            echo "| Worker state (tasks/locks) | ✅ Firestore (no KV setup needed) |"
            echo "| Sending endpoint | ✅ Email API \`email-api.mailercloud.com/email\` (+ \`/email-api\` mail merge) |"
            echo ""
            if [ '$MAILERCLOUD_API_KEY_SET' != 'true' ]; then
              echo "### ⚠️ To switch the email system ON"
              echo "1. Repo → **Settings → Secrets and variables → Actions → New repository secret**"
              echo "2. Add \`MAILERCLOUD_API_KEY\` (app.mailercloud.com → Account → API Integrations)"
              echo "3. Re-run this workflow (Run workflow button)"
            else
              echo "### ✅ Go-live check"
              echo "1. Open the app → More → **AI Email** → tap the **send (test) icon**"
              echo "2. Enter your own address — one real email is sent via \`email-api.mailercloud.com\` from \`das@aidraft.bond\`"
              echo "3. Check **MailerCloud → Logs**: the message must appear there. If you get a 400/error reply, the app shows the exact provider code to report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Ensure the D1 database exists (the Firestore replacement) ──
      # Create-if-missing, then read the real UUID back and inject it into
      # wrangler.toml for THIS deploy only (the repo never carries an
      # account-specific id). Then apply the schema (idempotent).
      - name: Ensure D1 database + schema
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi
          npx --yes wrangler@latest d1 create nebula-crm-db 2>&1 | tail -2 || \
            echo "::warning::D1 database already exists (or create failed — continuing)"
          D1_ID=$(npx --yes wrangler@latest d1 info nebula-crm-db --json 2>/dev/null \
            | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          if [ -z "$D1_ID" ]; then
            echo "::error::Could not resolve D1 database UUID."
            exit 1
          fi
          echo "::warning::D1 database nebula-crm-db = $D1_ID"
          sed -i "s/D1_DATABASE_ID/$D1_ID/" wrangler.toml
          npx --yes wrangler@latest d1 execute nebula-crm-db --remote --file schema.sql -y 2>&1 | tail -3
          echo "::warning::D1 schema applied"

      - name: Deploy worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi
          set -o pipefail
          if npx --yes wrangler@latest deploy 2>&1 | tee /tmp/wrangler.log; then
            # Surface the deployed URL as an annotation so it can be read
            # without downloading logs.
            grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/wrangler.log \
              | sort -u | while IFS= read -r u; do echo "::warning::WORKER_URL $u"; done
            echo "Deployed."
          else
            echo "::group::wrangler output"
            cat /tmp/wrangler.log
            echo "::endgroup::"
            # Dump the tail verbatim: wrangler's message wording varies, so
            # grepping for keywords loses the actual cause.
            tail -40 /tmp/wrangler.log | sed 's/[[:cntrl:]]\[[0-9;]*m//g' \
              | grep -v '^[[:space:]]*$' \
              | while IFS= read -r l; do echo "::error::WRANGLER ${l}"; done
            exit 1
          fi

      - name: Verify the Sarvam model responds
        env:
          SARVAM_AI_API: ${{ secrets.SARVAM_AI_API }}
        run: |
          [ -z "$SARVAM_AI_API" ] && exit 0
          CODE=$(curl -s -o /tmp/ai.json -w "%{http_code}" \
            -X POST https://api.sarvam.ai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "api-subscription-key: $SARVAM_AI_API" \
            -d '{"model":"sarvam-105b","messages":[{"role":"user","content":"Reply with the word ok"}],"temperature":0}')
          BODY=$(tr '\n' ' ' < /tmp/ai.json | cut -c1-220)
          echo "::warning::SARVAM model check HTTP $CODE $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Sarvam rejected the request - the model name or key is wrong."
            exit 1
          fi

      # Is the FCM API actually enabled on the project? Firestore was not,
      # and the failure looks identical from the app: silence.
      - name: Verify FCM is reachable
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && exit 0
          pip install --quiet google-auth requests
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json python3 - <<'PYEOF'
          import google.auth, google.auth.transport.requests as gt, requests
          creds, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          creds.refresh(gt.Request())
          print("::warning::FCM token minted OK")
          # A deliberately invalid device token: a healthy API replies 400
          # INVALID_ARGUMENT, a disabled one replies 403 with the reason.
          r = requests.post(
              "https://fcm.googleapis.com/v1/projects/nebula-crm-70f58/messages:send",
              headers={"Authorization": f"Bearer {creds.token}"},
              json={"message": {"token": "probe-invalid-token",
                                "notification": {"title": "probe", "body": "probe"}}},
              timeout=30)
          body = r.text.replace("\n", " ")[:400]
          print(f"::warning::FCM probe HTTP {r.status_code} {body}")
          PYEOF
          rm -f /tmp/sa.json

      - name: Smoke test
        run: |
          URL=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/wrangler.log | sort -u | head -1)
          if [ -z "$URL" ]; then
            echo "::warning::No workers.dev URL found; the worker may use a custom route."
            exit 0
          fi
          # A newly registered workers.dev subdomain needs a little time to
          # resolve, so retry rather than declaring failure on the first miss.
          CODE=000
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s --max-time 15 -o /tmp/health.txt -w "%{http_code}" "$URL/v1/health") || CODE=000
            [ "$CODE" = "200" ] && break
            echo "attempt $i -> $CODE, waiting..."
            sleep 15
          done
          echo "::warning::HEALTH $URL/v1/health -> HTTP $CODE $(head -c 120 /tmp/health.txt)"

          # An unauthenticated upload must be rejected.
          AUTHCODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" \
                       -X POST "$URL/v1/upload?path=avatars/x/a.png") || AUTHCODE=000
          echo "::warning::AUTHCHECK unauthenticated upload -> HTTP $AUTHCODE (expect 401)"

          if [ "$CODE" != "200" ]; then
            echo "::error::Worker did not respond 200 on /v1/health."
            exit 1
          fi
          if [ "$AUTHCODE" != "401" ]; then
            echo "::error::Unauthenticated upload returned $AUTHCODE, expected 401."
            exit 1
          fi
          echo "::warning::SMOKE TESTS PASSED"

      # ── End-to-end verification of the AI email system ───────────────────
      # The owner's go-live protocol, executed automatically after every
      # deploy: mint a short-lived Firebase ID token for a campaign-manager
      # user (superAdmin first), then call the deployed worker:
      #   GET  /v1/mail/status — must report the MailerCloud key present
      #   POST /v1/mail/test   — sends ONE real email via the MailerCloud
      #                          transactional Email API to that user's own
      #                          address. The provider's raw reply is echoed
      #                          verbatim so a 400 can be reported to
      #                          MailerCloud support exactly as received.
      # NEVER fails the deploy: a MailerCloud-side problem must not block
      # shipping code.
      - name: Verify AI email system end-to-end (one real test email)
        if: always()
        env:
          MAILERCLOUD_API_KEY_SET: ${{ secrets.MAILERCLOUD_API_KEY != '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_WEB_API_KEY: AIzaSyAmI0s71dkSfGrDo2mOrmgCUXk8UUYK2Fs
          FIREBASE_ANDROID_API_KEY: AIzaSyAvFw7TrlgwwKsivkcv_lEOwHutWpRcDYc
          WORKER_URL: https://nebula-crm-storage.nebula-crm.workers.dev
        run: |
          [ "$MAILERCLOUD_API_KEY_SET" = "true" ] || { echo "::warning::EMAILVERIFY skipped — MAILERCLOUD_API_KEY not set"; exit 0; }
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "::warning::EMAILVERIFY skipped — FIREBASE_SERVICE_ACCOUNT not set (cannot mint a token)"; exit 0; }
          pip install --quiet google-auth requests
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json python3 - <<'PYEOF'
          import json, os, time
          import requests
          import google.auth
          import google.auth.jwt
          import google.auth.transport.requests as gtr

          PROJECT = "nebula-crm-70f58"
          WORKER = os.environ["WORKER_URL"]
          KEYS = [os.environ.get("FIREBASE_WEB_API_KEY", ""),
                  os.environ.get("FIREBASE_ANDROID_API_KEY", "")]

          def say(msg):
              print(f"::warning::EMAILVERIFY {msg}")

          try:
              creds, _ = google.auth.default(
                  scopes=["https://www.googleapis.com/auth/datastore"])
              creds.refresh(gtr.Request())
          except Exception as e:
              say(f"service account auth failed: {e}")
              raise SystemExit(0)

          # 1) Find a campaign-manager user (superAdmin first) in Firestore.
          to_email = uid = None
          try:
              r = requests.get(
                  f"https://firestore.googleapis.com/v1/projects/{PROJECT}"
                  f"/databases/(default)/documents/users?pageSize=50",
                  headers={"Authorization": f"Bearer {creds.token}"}, timeout=30)
              r.raise_for_status()
              docs = []
              for d in r.json().get("documents", []):
                  f = d.get("fields", {})
                  role = (f.get("role", {}).get("stringValue") or "").strip()
                  email = (f.get("email", {}).get("stringValue") or "").strip()
                  if not email:
                      continue
                  u = d["name"].rsplit("/", 1)[-1]
                  docs.append((u, email, role))
              admins = [x for x in docs if x[2] == "superAdmin"]
              mgrs = [x for x in docs if x[2] in ("admin", "manager")]
              pool = admins + mgrs
              if pool:
                  uid, to_email, role = pool[0]
                  say(f"verifying as users/{uid} role={role} -> test email to {to_email}")
          except Exception as e:
              say(f"Firestore users read failed: {e}")
          if not uid:
              say("no superAdmin/admin/manager user with an email found in Firestore — cannot verify; open the app once and run the in-app test send instead")
              raise SystemExit(0)

          # 2) Mint a Firebase custom token for that uid, exchange for an
          #    ID token (same identity the Flutter app would present).
          now = int(time.time())
          payload = {
              "iss": creds.service_account_email,
              "sub": creds.service_account_email,
              "aud": "https://identitytoolkit.googleapis.com/"
                     "google.identity.identitytoolkit.v1.IdentityToolkit",
              "iat": now, "exp": now + 3500, "uid": uid,
          }
          try:
              # google-auth >= 2.38: encode(signer, payload) -> bytes
              try:
                  custom = google.auth.jwt.encode(creds.signer, payload)
              except TypeError:
                  # older releases: encode(payload, signer, algorithm=...)
                  custom = google.auth.jwt.encode(payload, creds.signer, algorithm="RS256")
              if isinstance(custom, bytes):
                  custom = custom.decode("ascii")
          except Exception as e:
              say(f"custom-token signing failed: {type(e).__name__}: {e}")
              raise SystemExit(0)

          id_token = None
          last_err = None
          for key in [k for k in KEYS if k]:
              try:
                  r = requests.post(
                      "https://identitytoolkit.googleapis.com/v1/"
                      "accounts:signInWithCustomToken",
                      params={"key": key},
                      json={"token": custom, "returnSecureToken": True}, timeout=30)
                  if r.ok:
                      id_token = r.json().get("idToken")
                      break
                  last_err = f"HTTP {r.status_code} {r.text[:200]}"
              except Exception as e:
                  last_err = str(e)
          if not id_token:
              say(f"custom-token exchange failed: {last_err}")
              raise SystemExit(0)
          AH = {"Authorization": f"Bearer {id_token}", "Content-Type": "application/json"}

          # 3) Status — is the mailer configured on the deployed worker?
          try:
              r = requests.get(f"{WORKER}/v1/mail/status", headers=AH, timeout=30)
              st = r.json() if "json" in r.headers.get("content-type", "") else {}
              say(f"/v1/mail/status HTTP {r.status_code} configured={st.get('configured')} "
                  f"ready={st.get('ready')} dryRun={st.get('dryRun')} "
                  f"missing={st.get('missing')} sender={st.get('sender', {}).get('from')}")
          except Exception as e:
              say(f"/v1/mail/status failed: {e}")

          # 4) ONE real email through the transactional Email API.
          try:
              r = requests.post(f"{WORKER}/v1/mail/test", headers=AH,
                                json={"to": to_email, "name": "Nebula Owner"}, timeout=120)
              body = r.json() if "json" in r.headers.get("content-type", "") else {"raw": r.text[:400]}
              if r.ok and body.get("ok"):
                  say(f"TEST EMAIL SENT to {to_email} from {body.get('from')} "
                      f"provider={json.dumps(body.get('provider'))[:200]} "
                      f"— check MailerCloud -> Logs")
              else:
                  say(f"TEST EMAIL FAILED HTTP {r.status_code} "
                      f"provider_status={body.get('provider_status')} "
                      f"message={body.get('message')} "
                      f"provider={json.dumps(body.get('provider'))[:400]}")
          except Exception as e:
              say(f"/v1/mail/test failed: {e}")
          PYEOF
          rm -f /tmp/sa.json

      # ── One-time data migration: Firestore → D1 ──────────────────────────
      # Mints a token for the workspace owner (superAdmin in Firestore) and
      # asks the Worker to copy every collection into D1. Idempotent: the
      # Worker skips itself once a 'migrated_at' marker exists (force=1
      # re-runs). Failure never blocks shipping.
      - name: Migrate CRM data Firestore -> D1
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_WEB_API_KEY: AIzaSyAmI0s71dkSfGrDo2mOrmgCUXk8UUYK2Fs
          FIREBASE_ANDROID_API_KEY: AIzaSyAvFw7TrlgwwKsivkcv_lEOwHutWpRcDYc
          WORKER_URL: https://nebula-crm-storage.nebula-crm.workers.dev
          MIGRATE_UID: JAx9p511pYgXdHDNEenbxiXDP4i1
        run: |
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] || { echo "::warning::MIGRATE skipped — no service account"; exit 0; }
          pip install --quiet google-auth requests
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json python3 - <<'PYEOF'
          import os, time, json
          import requests
          import google.auth
          import google.auth.jwt
          import google.auth.transport.requests as gtr

          WORKER = os.environ["WORKER_URL"]
          UID = os.environ["MIGRATE_UID"]
          KEYS = [os.environ.get("FIREBASE_WEB_API_KEY", ""), os.environ.get("FIREBASE_ANDROID_API_KEY", "")]

          def say(msg): print(f"::warning::MIGRATE {msg}")

          try:
              creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/datastore"])
              creds.refresh(gtr.Request())
          except Exception as e:
              say(f"service account auth failed: {e}"); raise SystemExit(0)

          now = int(time.time())
          payload = {"iss": creds.service_account_email, "sub": creds.service_account_email,
                     "aud": "https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit",
                     "iat": now, "exp": now + 3500, "uid": UID}
          try:
              try:
                  custom = google.auth.jwt.encode(creds.signer, payload)
              except TypeError:
                  custom = google.auth.jwt.encode(payload, creds.signer, algorithm="RS256")
              if isinstance(custom, bytes): custom = custom.decode("ascii")
          except Exception as e:
              say(f"custom-token signing failed: {e}"); raise SystemExit(0)

          id_token = None
          for key in [k for k in KEYS if k]:
              r = requests.post("https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken",
                                params={"key": key}, json={"token": custom, "returnSecureToken": True}, timeout=30)
              if r.ok:
                  id_token = r.json().get("idToken"); break
          if not id_token:
              say("custom-token exchange failed"); raise SystemExit(0)

          r = requests.post(f"{WORKER}/v1/admin/migrate-from-firestore",
                            headers={"Authorization": f"Bearer {id_token}"}, json={}, timeout=300)
          body = r.json() if "json" in r.headers.get("content-type", "") else {"raw": r.text[:300]}
          say(f"migration HTTP {r.status_code}: {json.dumps(body)[:600]}")
          PYEOF
          rm -f /tmp/sa.json
