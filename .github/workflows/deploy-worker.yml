name: Deploy Storage Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'cloudflare/worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A workers.dev subdomain is a one-time, account-wide setting. Wrangler
      # can only prompt for it interactively, which fails in CI, so register
      # it over the API instead.
      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: af3007244dc00e001004045fd488b42b
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/subdomain"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          CUR=$(curl -s -H "$AUTH" "$API")
          NAME=$(echo "$CUR" | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')" 2>/dev/null || echo "")

          if [ -n "$NAME" ]; then
            echo "::warning::SUBDOMAIN already registered: $NAME"
            exit 0
          fi

          # Subdomains are globally unique, so try a few candidates.
          for CAND in nebula-crm nebula-crm-app nebula-crm-${ACCOUNT:0:8}; do
            RES=$(curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" \
                    --data "{\"subdomain\":\"$CAND\"}" "$API")
            OK=$(echo "$RES" | python3 -c "import sys,json;print(json.load(sys.stdin).get('success'))" 2>/dev/null || echo False)
            if [ "$OK" = "True" ]; then
              echo "::warning::SUBDOMAIN registered: $CAND"
              exit 0
            fi
            echo "::warning::SUBDOMAIN '$CAND' unavailable: $(echo "$RES" | head -c 200)"
          done
          echo "::error::Could not register a workers.dev subdomain automatically."
          echo "::error::Register one manually: https://dash.cloudflare.com/$ACCOUNT/workers/onboarding"
          exit 1

      - name: Push Sarvam key as a Worker secret
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
          SARVAM_AI_API: ${{ secrets.SARVAM_AI_API }}
        run: |
          if [ -z "$SARVAM_AI_API" ]; then
            echo "::warning::SARVAM_AI_API not set - AI endpoint will return 503."
            exit 0
          fi
          printf '%s' "$SARVAM_AI_API" \
            | npx --yes wrangler@latest secret put SARVAM_API_KEY 2>&1 | tail -3
          echo "::warning::SARVAM_API_KEY stored as a Worker secret"

      - name: Push Firebase service account as a Worker secret
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT not set - push disabled."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            | npx --yes wrangler@latest secret put FIREBASE_SERVICE_ACCOUNT 2>&1 | tail -3
          echo "::warning::FIREBASE_SERVICE_ACCOUNT stored as a Worker secret"

      - name: Deploy worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: af3007244dc00e001004045fd488b42b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi
          set -o pipefail
          if npx --yes wrangler@latest deploy 2>&1 | tee /tmp/wrangler.log; then
            # Surface the deployed URL as an annotation so it can be read
            # without downloading logs.
            grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/wrangler.log \
              | sort -u | while IFS= read -r u; do echo "::warning::WORKER_URL $u"; done
            echo "Deployed."
          else
            echo "::group::wrangler output"
            cat /tmp/wrangler.log
            echo "::endgroup::"
            # Dump the tail verbatim: wrangler's message wording varies, so
            # grepping for keywords loses the actual cause.
            tail -40 /tmp/wrangler.log | sed 's/[[:cntrl:]]\[[0-9;]*m//g' \
              | grep -v '^[[:space:]]*$' \
              | while IFS= read -r l; do echo "::error::WRANGLER ${l}"; done
            exit 1
          fi

      - name: Verify the Sarvam model responds
        env:
          SARVAM_AI_API: ${{ secrets.SARVAM_AI_API }}
        run: |
          [ -z "$SARVAM_AI_API" ] && exit 0
          CODE=$(curl -s -o /tmp/ai.json -w "%{http_code}" \
            -X POST https://api.sarvam.ai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "api-subscription-key: $SARVAM_AI_API" \
            -d '{"model":"sarvam-105b","messages":[{"role":"user","content":"Reply with the word ok"}],"temperature":0}')
          BODY=$(tr '\n' ' ' < /tmp/ai.json | cut -c1-220)
          echo "::warning::SARVAM model check HTTP $CODE $BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Sarvam rejected the request - the model name or key is wrong."
            exit 1
          fi

      # Is the FCM API actually enabled on the project? Firestore was not,
      # and the failure looks identical from the app: silence.
      - name: Verify FCM is reachable
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && exit 0
          pip install --quiet google-auth requests
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json python3 - <<'PYEOF'
          import google.auth, google.auth.transport.requests as gt, requests
          creds, _ = google.auth.default(
              scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          creds.refresh(gt.Request())
          print("::warning::FCM token minted OK")
          # A deliberately invalid device token: a healthy API replies 400
          # INVALID_ARGUMENT, a disabled one replies 403 with the reason.
          r = requests.post(
              "https://fcm.googleapis.com/v1/projects/nebula-crm-70f58/messages:send",
              headers={"Authorization": f"Bearer {creds.token}"},
              json={"message": {"token": "probe-invalid-token",
                                "notification": {"title": "probe", "body": "probe"}}},
              timeout=30)
          body = r.text.replace("\n", " ")[:400]
          print(f"::warning::FCM probe HTTP {r.status_code} {body}")
          PYEOF
          rm -f /tmp/sa.json

      - name: Smoke test
        run: |
          URL=$(grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/wrangler.log | sort -u | head -1)
          if [ -z "$URL" ]; then
            echo "::warning::No workers.dev URL found; the worker may use a custom route."
            exit 0
          fi
          # A newly registered workers.dev subdomain needs a little time to
          # resolve, so retry rather than declaring failure on the first miss.
          CODE=000
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s --max-time 15 -o /tmp/health.txt -w "%{http_code}" "$URL/v1/health") || CODE=000
            [ "$CODE" = "200" ] && break
            echo "attempt $i -> $CODE, waiting..."
            sleep 15
          done
          echo "::warning::HEALTH $URL/v1/health -> HTTP $CODE $(head -c 120 /tmp/health.txt)"

          # An unauthenticated upload must be rejected.
          AUTHCODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" \
                       -X POST "$URL/v1/upload?path=avatars/x/a.png") || AUTHCODE=000
          echo "::warning::AUTHCHECK unauthenticated upload -> HTTP $AUTHCODE (expect 401)"

          if [ "$CODE" != "200" ]; then
            echo "::error::Worker did not respond 200 on /v1/health."
            exit 1
          fi
          if [ "$AUTHCODE" != "401" ]; then
            echo "::error::Unauthenticated upload returned $AUTHCODE, expected 401."
            exit 1
          fi
          echo "::warning::SMOKE TESTS PASSED"
